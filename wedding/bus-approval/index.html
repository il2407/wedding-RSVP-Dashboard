<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הרשמה להסעה</title>
  <style>

    /* Overridden per-tenant via JS from the couple's chosen theme color (see applyThemeColor) */
    :root {
      --primary: #f97316;
      --primary-dark: #ea580c;
      --primary-rgb: 249, 115, 22;
      --primary-dark-rgb: 234, 88, 12;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Heebo', Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #fed7aa 25%, #fdba74 50%, #fb923c 75%, var(--primary) 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(251, 146, 60, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(var(--primary-rgb), 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(245, 101, 101, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 
        0 20px 60px rgba(var(--primary-rgb), 0.15),
        0 8px 32px rgba(251, 146, 60, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      direction: rtl;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark), #dc2626, var(--primary));
      background-size: 400% 100%;
      animation: shimmer 3s ease-in-out infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .bus-header {
      margin-bottom: 2.5rem;
      position: relative;
      animation: slideInUp 0.8s ease-out;
    }
    
    .bus-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark), #dc2626);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
    }
    
    .wedding-sticker {
      width: 100px;
      height: 100px;
      object-fit: contain;
      animation: tilt 1s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(var(--primary-rgb), 0.3));
    }
    
    @keyframes tilt {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    
    .bus-subtitle {
      font-size: 1.1rem;
      color: #6b7280;
      font-weight: 400;
      margin-bottom: 1rem;
    }
    
    .bus-info {
      display: inline-block;
      background: linear-gradient(135deg, #fed7aa, #fdba74);
      color: var(--primary-dark);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid rgba(var(--primary-dark-rgb), 0.2);
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.2);
      animation: slideInUp 0.8s ease-out 0.2s both;
    }
    
    .form-container {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(var(--primary-rgb), 0.1);
      backdrop-filter: blur(10px);
      animation: slideInUp 0.8s ease-out 1.4s both;
      transition: all 0.3s ease;
    }
    
    .form-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(var(--primary-rgb), 0.15);
    }
    
    .form-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(var(--primary-rgb), 0.1);
    }
    
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    label {
      display: block;
      margin-bottom: 0.8rem;
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 1.1rem;
      text-align: right;
    }
    
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      border: 2px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      direction: rtl;
      font-weight: 500;
    }
    
    input[type="text"]:focus, input[type="tel"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
      transform: translateY(-2px) scale(1.02);
    }
    
    select {
      width: 100%;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      border: 2px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      direction: rtl;
      font-weight: 500;
      cursor: pointer;
    }
    
    select:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
      transform: translateY(-2px) scale(1.02);
    }
    
    .tab-navigation {
      display: flex;
      margin-bottom: 2rem;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.1);
    }
    
    .tab-btn {
      flex: 1;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-bottom-color: #dc2626;
    }
    
    .tab-btn:hover:not(.active) {
      background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-dark);
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .checkbox-container input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }
    
    .checkbox-container label {
      margin-bottom: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-dark);
    }
    
    button {
      width: 100%;
      padding: 1.2rem 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.3);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(var(--primary-rgb), 0.4);
    }
    
    button:active {
      transform: translateY(-1px) scale(0.98);
    }
    
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .confirmation {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 2rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .confirmation.success {
      color: #059669;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border: 1px solid rgba(5, 150, 105, 0.2);
    }
    
    .confirmation.error {
      color: #dc2626;
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1rem;
    }
    
    .loading svg {
      width: 28px;
      height: 28px;
    }
    
    .loading span {
      color: #6b7280;
      font-weight: 600;
    }
    
    .bus-tip {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.15);
    }

    .passenger-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .passenger-header .section-title {
      margin-bottom: 0;
    }

    .direction-row {
      display: flex;
      gap: 1rem;
    }

    .direction-row > div {
      flex: 1;
    }

    /* Colors come from the theme's .secondary / .danger button styles */
    .remove-passenger-btn {
      width: auto;
    }

    body button.danger.remove-passenger-btn:hover {
      background: #ffe1d9;
    }

    .add-passenger-btn {
      margin-bottom: 1.5rem;
      border-style: dashed !important;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem 2rem 1.5rem;
        max-width: 95vw;
        margin: 1rem;
      }
      
      .bus-title {
        font-size: 2rem;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;family=Frank+Ruhl+Libre:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap">
  <link rel="stylesheet" href="/assets/wedding-theme.css">
</head>
<body class="guest-page bus-approval-page">
  <a class="skip-to-content" href="#main-content">דילוג לתוכן</a>
  <div class="container" id="main-content" role="main" tabindex="-1">
    <div class="invitation-kicker" dir="ltr">LET’S CELEBRATE TOGETHER</div><div class="bus-header">
      <h1 class="bus-title">
        <img id="groom-photo" src="" alt="" class="wedding-sticker" style="display:none;" onerror="this.style.display='none'">
        רישום להסעה
        <img id="bride-photo" src="" alt="" class="wedding-sticker" style="display:none;" onerror="this.style.display='none'">
      </h1>
      <p class="bus-subtitle" id="bus-subtitle">החתונה</p>
        <div class="bus-info">
          <span id="bus-pickup-text"></span><br>
          <span id="bus-destination-text"></span><br>

          יוצאת בשעה <span id="bus-departure-text"></span><br>
          חוזרת בשעה <span id="bus-return-text"></span>
        </div>
    </div>
    
    <div class="form-container">
      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button type="button" class="tab-btn active" data-tab="registration">הרשמה להסעה</button>
        <button type="button" class="tab-btn" data-tab="attendance">אני באוטובוס</button>
      </div>
      
      <!-- Registration Tab -->
      <div id="registration-tab" class="tab-content active">
        <form id="bus-form" autocomplete="off">
          <div class="bus-tip">
            כל נוסע נרשם עם שם וטלפון משלו - הטלפון מזהה אותו, ותמיד אפשר לחזור ולעדכן! 💡
          </div>

          <!-- One card per passenger, built by addPassenger() -->
          <div id="passengers"></div>

          <button type="button" id="add-passenger-btn" class="secondary add-passenger-btn">+ הוספת נוסע</button>

          <button type="submit" id="submit-btn">
            <span id="btn-text">הרשמה</span>
            <span id="btn-spinner" style="display:none; margin-right:8px; vertical-align:middle;">
              <svg width="20" height="20" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" stroke="#fff">
                <g fill="none" fill-rule="evenodd">
                  <g transform="translate(1 1)" stroke-width="3">
                    <circle stroke-opacity=".3" cx="18" cy="18" r="18"/>
                    <path d="M36 18c0-9.94-8.06-18-18-18">
                      <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
                    </path>
                  </g>
                </g>
              </svg>
            </span>
          </button>
        </form>
      </div>
      
      <!-- Attendance Tab -->
      <div id="attendance-tab" class="tab-content">
        <form id="attendance-form" autocomplete="off">
          <!-- Personal Information Section -->
          <div class="form-section">
            <h3 class="section-title">פרטים אישיים</h3>
            <label for="attendanceName">שם מלא</label>
            <input type="text" id="attendanceName" name="attendanceName" required>
            
            <label for="attendancePhone">מספר טלפון</label>
            <input type="tel" id="attendancePhone" name="attendancePhone" required>
          </div>
          
          <!-- Bus Attendance Section -->
          <div class="form-section">
            <h3 class="section-title">אישור נוכחות באוטובוס</h3>
            
            <div class="checkbox-container">
              <input type="checkbox" id="onBusGoing" name="onBusGoing">
              <label for="onBusGoing">אני על האוטובוס בהלוך</label>
            </div>
            
            <div class="checkbox-container">
              <input type="checkbox" id="onBusReturn" name="onBusReturn">
              <label for="onBusReturn">אני על האוטובוס בחזור</label>
            </div>
          </div>
          
          <button type="submit" id="attendance-submit-btn">
            <span id="attendance-btn-text">שלח אישור נוכחות</span>
            <span id="attendance-btn-spinner" style="display:none; margin-right:8px; vertical-align:middle;">
              <svg width="20" height="20" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" stroke="#fff">
                <g fill="none" fill-rule="evenodd">
                  <g transform="translate(1 1)" stroke-width="3">
                    <circle stroke-opacity=".3" cx="18" cy="18" r="18"/>
                    <path d="M36 18c0-9.94-8.06-18-18-18">
                      <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
                    </path>
                  </g>
                </g>
              </svg>
            </span>
          </button>
        </form>
      </div>
      
      <div id="loading" class="loading">
        <svg width="28" height="28" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" stroke="var(--primary-dark)">
          <g fill="none" fill-rule="evenodd">
            <g transform="translate(1 1)" stroke-width="3">
              <circle stroke-opacity=".2" cx="18" cy="18" r="18"/>
              <path d="M36 18c0-9.94-8.06-18-18-18">
                <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="0.9s" repeatCount="indefinite"/>
              </path>
            </g>
          </g>
        </svg>
        <span>שולח...</span>
      </div>
    </div>
    
    <p class="guest-signoff" dir="ltr">with love, always.</p>
    <div class="confirmation" id="confirmation" role="status" aria-live="polite"></div>
  </div>
  
  <script src="/assets/hebrew-name-format.js"></script>
  <script>
    const form = document.getElementById('bus-form');
    const attendanceForm = document.getElementById('attendance-form');
    const confirmation = document.getElementById('confirmation');
    const submitBtn = document.getElementById('submit-btn');
    const attendanceSubmitBtn = document.getElementById('attendance-submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const attendanceBtnText = document.getElementById('attendance-btn-text');
    const attendanceBtnSpinner = document.getElementById('attendance-btn-spinner');
    const loading = document.getElementById('loading');
    
    // Tab functionality
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.getAttribute('data-tab');
        
        // Remove active class from all tabs and contents
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        // Add active class to clicked tab and corresponding content
        btn.classList.add('active');
        document.getElementById(targetTab + '-tab').classList.add('active');
      });
    });
    
    // Function to get URL parameters
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      const results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Every guest link carries the tenant (account) id: /bus-approval/?u=<tenantId>&phone=<phone>
    const TENANT_ID = getUrlParameter('u');
    // Lets an admin open their own bus form (e.g. from a "Preview" button in /admin/)
    // without submitting real data; the form still validates but never hits the server.
    const PREVIEW_MODE = getUrlParameter('preview') === '1';

    // Function to load event config and populate the page
    // Recolors the page to the tenant's chosen theme color, derived from a single hex
    // value stored in settings (the darker "-dark" shade used for gradients/hover states
    // is computed on the fly rather than stored separately).
    function applyThemeColor(hex) {
      if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
      const toRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const toHex = (rgb) => '#' + rgb.map((c) => Math.max(0, Math.min(255, c)).toString(16).padStart(2, '0')).join('');

      const rgb = toRgb(hex);
      const darkRgb = rgb.map((c) => Math.round(c * 0.85));
      const darkHex = toHex(darkRgb);

      const root = document.documentElement.style;
      root.setProperty('--primary', hex);
      root.setProperty('--primary-dark', darkHex);
      root.setProperty('--primary-rgb', rgb.join(', '));
      root.setProperty('--primary-dark-rgb', darkRgb.join(', '));
    }

    async function loadConfig() {
      try {
        const response = await fetch(`/api/public/${TENANT_ID}/config`);
        if (!response.ok) return;
        const config = await response.json();

        applyThemeColor(config.theme_color);
        const coupleNames = formatHebrewNameList([config.couple_name_1, config.couple_name_2]);
        document.title = `${coupleNames} - הרשמה להסעה`;
        document.getElementById('bus-subtitle').textContent = `החתונה של ${coupleNames}`;
        document.getElementById('bus-pickup-text').textContent = config.bus_pickup_location;
        document.getElementById('bus-destination-text').textContent = config.bus_destination_text;
        document.getElementById('bus-departure-text').textContent = config.bus_departure_time;
        document.getElementById('bus-return-text').textContent = config.bus_return_time;

        const groomPhoto = document.getElementById('groom-photo');
        if (groomPhoto) { groomPhoto.src = `/media/${TENANT_ID}/groom_photo`; groomPhoto.style.display = 'inline-block'; }
        const bridePhoto = document.getElementById('bride-photo');
        if (bridePhoto) { bridePhoto.src = `/media/${TENANT_ID}/bride_photo`; bridePhoto.style.display = 'inline-block'; }
      } catch (error) {
        console.error('Error fetching config:', error);
      }
    }

    // Function to fetch an existing bus registration for a phone number, or null if none exists
    async function fetchExistingRegistration(phone) {
      const res = await fetch(`/api/public/${TENANT_ID}/bus-registrations/` + encodeURIComponent(phone));
      if (res.status === 404) return null;
      if (!res.ok) throw new Error();
      return await res.json();
    }

    const passengersEl = document.getElementById('passengers');
    let passengerSeq = 0;

    // Renumbers the cards and only offers "remove" when there's more than one passenger
    function refreshPassengerCards() {
      const cards = passengersEl.querySelectorAll('.passenger');
      cards.forEach((card, i) => {
        card.querySelector('.section-title').textContent = `נוסע ${i + 1}`;
        card.querySelector('.remove-passenger-btn').style.display = cards.length > 1 ? '' : 'none';
      });
    }

    // Adds a passenger card: full name, phone, and yes/no for each direction
    function addPassenger(name = '', phone = '') {
      const id = ++passengerSeq;
      const card = document.createElement('div');
      card.className = 'form-section passenger';
      card.innerHTML = `
        <div class="passenger-header">
          <h3 class="section-title"></h3>
          <button type="button" class="danger remove-passenger-btn">הסרה</button>
        </div>
        <label for="p-name-${id}">שם מלא</label>
        <input type="text" id="p-name-${id}" class="p-name" required>
        <label for="p-phone-${id}">מספר טלפון</label>
        <input type="tel" id="p-phone-${id}" class="p-phone" required>
        <div class="direction-row">
          <div>
            <label for="p-going-${id}">🎊 בהלוך?</label>
            <select id="p-going-${id}" class="p-going">
              <option value="1">כן</option>
              <option value="0">לא</option>
            </select>
          </div>
          <div>
            <label for="p-return-${id}">🏠 בחזור?</label>
            <select id="p-return-${id}" class="p-return">
              <option value="1">כן</option>
              <option value="0">לא</option>
            </select>
          </div>
        </div>`;
      card.querySelector('.p-name').value = name;
      card.querySelector('.p-phone').value = phone;
      card.querySelector('.remove-passenger-btn').addEventListener('click', () => {
        card.remove();
        refreshPassengerCards();
      });
      passengersEl.appendChild(card);
      refreshPassengerCards();
      return card;
    }

    function resetPassengers() {
      passengersEl.innerHTML = '';
      addPassenger();
    }

    document.getElementById('add-passenger-btn').addEventListener('click', () => {
      addPassenger().querySelector('.p-name').focus();
    });

    // Auto-fill the first passenger (and the "I'm on the bus" tab) from URL parameters
    function autoFillFromUrl() {
      const phone = getUrlParameter('phone');
      const name = getUrlParameter('name');
      const first = passengersEl.querySelector('.passenger');
      first.querySelector('.p-name').value = name;
      first.querySelector('.p-phone').value = phone;
      document.getElementById('attendanceName').value = name;
      document.getElementById('attendancePhone').value = phone;
    }
    
    // Validate phone number
    function validatePhone(phone) {
      return /^[0-9]{9,15}$/.test(phone);
    }
    
    // Show loading state
    function showLoading() {
      submitBtn.disabled = true;
      attendanceSubmitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';
      loading.style.display = 'flex';
    }
    
    // Hide loading state
    function hideLoading() {
      submitBtn.disabled = false;
      attendanceSubmitBtn.disabled = false;
      btnText.style.display = 'inline';
      btnSpinner.style.display = 'none';
      loading.style.display = 'none';
    }
    
    // Show confirmation message
    function showConfirmation(message, isSuccess = true) {
      confirmation.textContent = message;
      confirmation.className = `confirmation ${isSuccess ? 'success' : 'error'}`;
    }
    
    // Show modal asking whether to overwrite passengers who are already registered.
    // The message contains guest-typed names, so it's set via textContent, never innerHTML.
    function showUpdateModal(message) {
      return new Promise((resolve) => {
        const modal = document.createElement('div');
        modal.style.cssText = `
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(8px);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
        `;
        
        modal.innerHTML = `
          <div style="
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 400px;
            width: 90vw;
            text-align: center;
            direction: rtl;
            border: 1px solid rgba(255, 255, 255, 0.3);
          ">
            <div id="modal-message" style="
              color: #374151;
              font-size: 1.2rem;
              margin-bottom: 2rem;
              line-height: 1.6;
              font-weight: 500;
              white-space: pre-line;
            "></div>
            <div style="display: flex; justify-content: center; gap: 1rem;">
              <button id="modal-update" style="
                padding: 0.8rem 1.5rem;
                border-radius: 12px;
                border: none;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                color: #fff;
                box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3);
                min-width: 100px;
              ">עדכן</button>
              <button id="modal-cancel" style="
                padding: 0.8rem 1.5rem;
                border-radius: 12px;
                border: none;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.9);
                color: #6b7280;
                border: 1px solid rgba(107, 114, 128, 0.2);
                min-width: 100px;
              ">ביטול</button>
            </div>
          </div>
        `;
        modal.querySelector('#modal-message').textContent = message;
        
        document.body.appendChild(modal);
        
        const updateBtn = modal.querySelector('#modal-update');
        const cancelBtn = modal.querySelector('#modal-cancel');
        
        function cleanup(result) {
          document.body.removeChild(modal);
          resolve(result);
        }
        
        updateBtn.addEventListener('click', () => cleanup(true));
        cancelBtn.addEventListener('click', () => cleanup(false));
        modal.addEventListener('click', (e) => {
          if (e.target === modal) cleanup(false);
        });
      });
    }

    function sendRegistration(phone, data, exists) {
      const url = exists
        ? `/api/public/${TENANT_ID}/bus-registrations/` + encodeURIComponent(phone)
        : `/api/public/${TENANT_ID}/bus-registrations`;
      return fetch(url, {
        method: exists ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }
    
    // Registration: every passenger is saved as their own registration (one row per phone),
    // with going/return counts of 1 (yes) or 0 (no). The "on the bus" confirmations are left
    // out on purpose so re-registering never erases them.
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const passengers = [...passengersEl.querySelectorAll('.passenger')].map(card => ({
        full_name: card.querySelector('.p-name').value.trim(),
        phone: card.querySelector('.p-phone').value.replace(/\D/g, ''),
        going_count: Number(card.querySelector('.p-going').value),
        return_count: Number(card.querySelector('.p-return').value)
      }));

      // Validation
      const seenPhones = new Set();
      for (const [i, p] of passengers.entries()) {
        const label = `נוסע ${i + 1}`;
        if (!p.full_name) {
          showConfirmation(`${label}: אנא הזן שם מלא`, false);
          return;
        }
        if (!validatePhone(p.phone)) {
          showConfirmation(`${label}: אנא הזן מספר טלפון תקין`, false);
          return;
        }
        if (seenPhones.has(p.phone)) {
          showConfirmation(`${label}: מספר הטלפון כבר מופיע אצל נוסע אחר`, false);
          return;
        }
        if (!p.going_count && !p.return_count) {
          showConfirmation(`${label}: אנא בחר הלוך, חזור או שניהם`, false);
          return;
        }
        seenPhones.add(p.phone);
      }

      if (PREVIEW_MODE) {
        showConfirmation('תצוגה מקדימה - לא נשמר בפועל', true);
        resetPassengers();
        return;
      }

      showLoading();

      try {
        // Passengers whose phone is already registered get updated instead of created
        const existing = await Promise.all(passengers.map(p => fetchExistingRegistration(p.phone)));
        const existingNames = existing.filter(Boolean).map(r => r.full_name);

        if (existingNames.length > 0) {
          const userWantsUpdate = await showUpdateModal(
            `כבר רשומים להסעה:\n${existingNames.join(', ')}\n\nלעדכן את הפרטים שלהם?`
          );
          if (!userWantsUpdate) {
            showConfirmation('ההרשמה בוטלה. הנתונים הקודמים נשמרו.', false);
            return;
          }
        }

        const failed = [];
        for (const [i, p] of passengers.entries()) {
          try {
            const response = await sendRegistration(p.phone, p, Boolean(existing[i]));
            if (!response.ok) failed.push(p.full_name);
          } catch {
            failed.push(p.full_name);
          }
        }

        if (failed.length > 0) {
          showConfirmation(`לא הצלחנו לרשום את: ${failed.join(', ')}. נסה שוב בעוד רגע.`, false);
          return;
        }

        if (passengers.length > 1) {
          showConfirmation(`${passengers.length} נוסעים נרשמו בהצלחה! 🚌`, true);
        } else {
          showConfirmation(existingNames.length ? 'ההרשמה עודכנה בהצלחה! 🚌' : 'ההרשמה נשלחה בהצלחה! 🚌', true);
        }
        resetPassengers();
      } catch (error) {
        console.error('Error:', error);
        showConfirmation('אירעה שגיאה בשליחה. נסה שוב בעוד רגע.', false);
      } finally {
        hideLoading();
      }
    });
    
    // "I'm on the bus": only the ticked directions are sent, so ticking "return" on the way
    // back keeps the morning's "going" confirmation and never touches anything else.
    attendanceForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(attendanceForm);
      const phone = formData.get('attendancePhone').replace(/\D/g, '');
      const onGoing = formData.get('onBusGoing') === 'on';
      const onReturn = formData.get('onBusReturn') === 'on';
      const data = { full_name: formData.get('attendanceName').trim() };
      if (onGoing) data.going_confirmed = true;
      if (onReturn) data.return_confirmed = true;

      // Validation
      if (!data.full_name) {
        showConfirmation('אנא הזן שם מלא', false);
        return;
      }

      if (!validatePhone(phone)) {
        showConfirmation('אנא הזן מספר טלפון תקין', false);
        return;
      }

      if (!onGoing && !onReturn) {
        showConfirmation('אנא בחר לפחות אפשרות אחת', false);
        return;
      }

      if (PREVIEW_MODE) {
        showConfirmation('תצוגה מקדימה - לא נשמר בפועל', true);
        attendanceForm.reset();
        return;
      }

      showLoading();

      try {
        const existing = await fetchExistingRegistration(phone);
        // Being on the bus in a direction also means riding it: mark that direction if it
        // wasn't registered yet (an existing count, e.g. an older group of 3, is kept).
        if (onGoing && !(existing && existing.going_count > 0)) data.going_count = 1;
        if (onReturn && !(existing && existing.return_count > 0)) data.return_count = 1;
        const response = await sendRegistration(phone, { ...data, phone }, Boolean(existing));
        if (!response.ok) throw new Error('Failed to save attendance');

        showConfirmation(existing ? 'אישור הנוכחות עודכן בהצלחה! 🚌' : 'אישור הנוכחות נשלח בהצלחה! 🚌', true);
        attendanceForm.reset();
      } catch (error) {
        console.error('Error:', error);
        showConfirmation('אירעה שגיאה בשליחה. נסה שוב בעוד רגע.', false);
      } finally {
        hideLoading();
      }
    });
    
    // Initialize page on load
    loadConfig();
    addPassenger();
    autoFillFromUrl();
  </script>
</body>
</html>
