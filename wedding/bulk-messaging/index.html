<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulk WhatsApp Sender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heebo', Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #fed7aa 25%, #fdba74 50%, #fb923c 75%, #f97316 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(249, 115, 22, 0.15);
        }
        
        h1 {
            text-align: center;
            color: #ea580c;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #ea580c;
        }
        
        textarea, input {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(249, 115, 22, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        
        textarea:focus, input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .phone-list {
            min-height: 200px;
            font-family: monospace;
        }
        
        .preview {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .preview h3 {
            color: #ea580c;
            margin-bottom: 0.5rem;
        }
        
        .preview-message {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        
        .send-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }
        
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.3);
        }
        
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .secondary-btn:hover {
            background: #d1d5db;
        }

        .secondary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        
        .status.success {
            background: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        
        .status.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .progress {
            margin-top: 1rem;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, #f97316, #ea580c);
            transition: width 0.3s ease;
        }

        .admin-nav {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }

        .admin-nav-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ea580c;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 0.5rem 1.1rem;
            border-radius: 10px;
        }

        .admin-nav-link:hover { background: #fff; }

        .admin-nav-link.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
        }

        .admin-nav-link.admin-nav-logout {
            margin-inline-start: auto;
            color: #6b7280;
            background: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="admin-nav">
            <a href="/dashboard/" class="admin-nav-link">דשבורד</a>
            <a href="/admin/" class="admin-nav-link">ניהול</a>
            <a href="/bulk-messaging/" class="admin-nav-link active">שליחה המונית</a>
            <a href="#" class="admin-nav-link admin-nav-logout" id="logout-link">יציאה</a>
        </nav>
        <h1 id="page-title">Bulk WhatsApp Sender</h1>

        <div class="form-group">
            <label for="message-template">Message Template:</label>
            <textarea id="message-template" placeholder="Enter your message template here. Use {phone} to insert the phone number and {link} to insert the personalized link."></textarea>
        </div>

        <div class="form-group">
            <label for="phone-numbers">Phone Numbers (one per line):</label>
            <textarea id="phone-numbers" class="phone-list" placeholder="0541234567&#10;0547654321&#10;0509876543"></textarea>
            <button type="button" class="secondary-btn" id="load-invited-btn">Load all invited guests</button>
        </div>

        <button class="send-btn" onclick="previewMessages()">Preview Messages</button>
        
        <div id="preview-container" style="display: none;">
            <div class="preview">
                <h3>Message Preview:</h3>
                <div id="preview-messages"></div>
            </div>
            <button class="send-btn" onclick="sendBulkMessages()">Send Bulk Messages</button>
        </div>
        
        <div id="status"></div>
        <div class="progress" id="progress" style="display: none;">
            <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
        </div>
        
        <!-- Next Chat Button - Always visible -->
        <button id="next-chat-btn" class="send-btn" style="display: none; background: linear-gradient(135deg, #059669, #047857);" onclick="openNextChat()">
            ➡️ Next Chat
        </button>
    </div>

    <script>
        let currentUserId = null;
        let countryCode = '';
        // The RSVP form is always served from this same app/domain, so there's nothing
        // for the admin to configure here.
        const RSVP_BASE_URL = window.location.origin + '/rsvp-form/';

        // wa.me links require the full international number with no leading zero and no
        // "+" (e.g. 972501234567), while the guest list itself, the {phone} substitution,
        // and the personalized RSVP link all keep using the phone number as typed (e.g.
        // 0501234567) so it still matches what's stored for that guest.
        function toWhatsAppNumber(phone) {
            const digits = phone.replace(/\D/g, '');
            if (countryCode && digits.startsWith(countryCode)) return digits;
            return `${countryCode}${digits.replace(/^0+/, '')}`;
        }

        // A number is safe to convert automatically if it's either a local number
        // (starts with 0) or already carries the account's country code. Anything else
        // (missing digits, a typo, or a different country's number without its own code)
        // would get the wrong country code prepended and silently fail to open in WhatsApp.
        function isMissingCountryPrefix(phone) {
            const digits = phone.replace(/\D/g, '');
            if (digits.startsWith('0')) return false;
            if (countryCode && digits.startsWith(countryCode)) return false;
            return true;
        }

        async function loadCurrentUser() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) return;
                const user = await res.json();
                currentUserId = user.id;
            } catch (error) {
                console.error('Error fetching current user:', error);
            }
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/admin/config');
                if (!res.ok) return;
                const config = await res.json();

                const title = `Bulk WhatsApp Sender - ${config.couple_name_1} ${config.couple_name_2}`;
                document.title = title;
                document.getElementById('page-title').textContent = title;
                document.getElementById('message-template').value = config.whatsapp_message_template || '';
                countryCode = (config.whatsapp_country_code || '').replace(/\D/g, '');
            } catch (error) {
                console.error('Error fetching config:', error);
            }
        }
        loadCurrentUser();
        loadConfig();

        document.getElementById('logout-link').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login/';
        });

        document.getElementById('load-invited-btn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/invited-guests');
                if (!res.ok) {
                    showStatus('Could not load the invited guest list.', 'error');
                    return;
                }
                const guests = await res.json();
                if (guests.length === 0) {
                    showStatus('Your invited guest list is empty.', 'error');
                    return;
                }
                document.getElementById('phone-numbers').value = guests.map(g => g.phone).join('\n');
                showStatus(`Loaded ${guests.length} phone number(s) from your invited guest list.`, 'success');
            } catch (error) {
                console.error('Error loading invited guests:', error);
                showStatus('Could not load the invited guest list.', 'error');
            }
        });

        function buildPersonalizedLink(baseUrl, phone) {
            const separator = baseUrl.includes('?') ? '&' : '?';
            return `${baseUrl}${separator}u=${currentUserId}&phone=${phone}`;
        }

        function previewMessages() {
            const template = document.getElementById('message-template').value;
            const phoneNumbers = document.getElementById('phone-numbers').value.split('\n').filter(phone => phone.trim());
            const baseUrl = RSVP_BASE_URL;
            
            if (!template || phoneNumbers.length === 0) {
                showStatus('Please fill in both message template and phone numbers.', 'error');
                return;
            }

            if (!template.includes('{link}')) {
                showStatus('Template must include {link} so guests can reach their RSVP form.', 'error');
                return;
            }
            
            const previewContainer = document.getElementById('preview-container');
            const previewMessages = document.getElementById('preview-messages');
            previewMessages.innerHTML = '';
            
            phoneNumbers.forEach((phone, index) => {
                const cleanPhone = phone.trim();
                if (cleanPhone) {
                    const personalizedLink = buildPersonalizedLink(baseUrl, cleanPhone);
                    const message = template
                        .replace(/{phone}/g, cleanPhone)
                        .replace(/{link}/g, personalizedLink);
                    
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'preview-message';
                    messageDiv.innerHTML = `
                        <strong>To: ${cleanPhone}</strong><br>
                        <div style="margin-top: 0.5rem; white-space: pre-wrap;">${message}</div>
                    `;
                    previewMessages.appendChild(messageDiv);
                }
            });
            
            previewContainer.style.display = 'block';
            showStatus(`Preview generated for ${phoneNumbers.length} messages.`, 'success');
        }
        
        function sendBulkMessages() {
            const template = document.getElementById('message-template').value;
            const phoneNumbers = document.getElementById('phone-numbers').value.split('\n').filter(phone => phone.trim());
            const baseUrl = RSVP_BASE_URL;
            
            if (!template || phoneNumbers.length === 0) {
                showStatus('Please fill in both message template and phone numbers.', 'error');
                return;
            }

            if (!template.includes('{link}')) {
                showStatus('Template must include {link} so guests can reach their RSVP form.', 'error');
                return;
            }

            if (!countryCode) {
                showStatus('Set a WhatsApp country code in event settings first (e.g. 972) so numbers open correctly in WhatsApp.', 'error');
                return;
            }

            const suspiciousNumbers = phoneNumbers.map(p => p.trim()).filter(isMissingCountryPrefix);
            if (suspiciousNumbers.length > 0) {
                const proceed = confirm(
                    `The following number(s) don't start with "0" or the country code (${countryCode}), so WhatsApp may not open them correctly:\n\n` +
                    suspiciousNumbers.join('\n') +
                    '\n\nSend anyway?'
                );
                if (!proceed) {
                    showStatus('Cancelled. Please fix the flagged phone number(s) and try again.', 'error');
                    return;
                }
            }

            const sendBtn = document.querySelector('.send-btn');
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progress-bar');
            
            sendBtn.disabled = true;
            progress.style.display = 'block';
            
            let sentCount = 0;
            const totalCount = phoneNumbers.length;
            
            // Create all WhatsApp URLs first
            const whatsappUrls = [];
            phoneNumbers.forEach((phone, index) => {
                const cleanPhone = phone.trim();
                if (cleanPhone) {
                    const personalizedLink = buildPersonalizedLink(baseUrl, cleanPhone);
                    const message = template
                        .replace(/{phone}/g, cleanPhone)
                        .replace(/{link}/g, personalizedLink);
                    
                    const whatsappUrl = `https://wa.me/${toWhatsAppNumber(cleanPhone)}?text=${encodeURIComponent(message)}`;
                    whatsappUrls.push({
                        phone: cleanPhone,
                        url: whatsappUrl,
                        message: message
                    });
                }
            });
            
            // Show options to user
            showWhatsAppOptions(whatsappUrls);
            
            // Reset UI
            sendBtn.disabled = false;
            progress.style.display = 'none';
        }
        
        function showWhatsAppOptions(whatsappUrls) {
            const statusDiv = document.getElementById('status');
            
            // Create options container
            const optionsContainer = document.createElement('div');
            optionsContainer.style.cssText = `
                background: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                padding: 1.5rem;
                margin-top: 1rem;
            `;
            
            optionsContainer.innerHTML = `
                <h3 style="color: #ea580c; margin-bottom: 1rem;">WhatsApp Sending Options:</h3>
                <div style="margin-bottom: 1rem;">
                    <button onclick="openAllWhatsAppChats(${JSON.stringify(whatsappUrls).replace(/"/g, '&quot;')})" 
                            style="background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; margin-right: 0.5rem; cursor: pointer;">
                        📱 Open WhatsApp Chats (One by One)
                    </button>
                    <button onclick="copyAllMessages(${JSON.stringify(whatsappUrls).replace(/"/g, '&quot;')})" 
                            style="background: #6b7280; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; margin-right: 0.5rem; cursor: pointer;">
                        📋 Copy All Messages
                    </button>
                    <button onclick="downloadMessages(${JSON.stringify(whatsappUrls).replace(/"/g, '&quot;')})" 
                            style="background: #059669; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;">
                        💾 Download Messages
                    </button>
                </div>
                <div style="font-size: 0.9rem; color: #6b7280; background: #fef3c7; padding: 0.8rem; border-radius: 8px; border: 1px solid #f59e0b;">
                    <strong>📱 WhatsApp Instructions:</strong><br>
                    • Click "Open WhatsApp Chats" to start<br>
                    • Each chat will open one at a time<br>
                    • Click "Next Chat" to open the next one<br>
                    • Send the message in each chat window<br>
                    • Allow popups if your browser asks
                </div>
            `;
            
            statusDiv.innerHTML = '';
            statusDiv.appendChild(optionsContainer);
        }
        
        function openAllWhatsAppChats(whatsappUrls) {
            // Store the URLs globally for sequential opening
            window.whatsappUrls = whatsappUrls;
            window.currentIndex = 0;
            
            // Show the Next Chat button
            const nextBtn = document.getElementById('next-chat-btn');
            nextBtn.style.display = 'block';
            nextBtn.disabled = false;
            
            // Start with the first one
            openNextChat();
        }
        
        function openNextChat() {
            if (window.currentIndex >= window.whatsappUrls.length) {
                showStatus('All WhatsApp chats have been opened!', 'success');
                const nextBtn = document.getElementById('next-chat-btn');
                nextBtn.style.display = 'none';
                return;
            }
            
            const currentItem = window.whatsappUrls[window.currentIndex];
            const windowName = `whatsapp_${window.currentIndex}`;
            
            // Open the current chat
            const popup = window.open(currentItem.url, windowName, 'width=600,height=800');
            
            if (popup) {
                showStatus(`✅ Opened chat ${window.currentIndex + 1}/${window.whatsappUrls.length} for ${currentItem.phone}. Send the message, then click "Next Chat" below.`, 'success');
                
                // Update button text and increment index
                const nextBtn = document.getElementById('next-chat-btn');
                window.currentIndex++; // Move to next index
                
                if (window.currentIndex < window.whatsappUrls.length) {
                    nextBtn.textContent = `➡️ Next Chat (${window.currentIndex + 1}/${window.whatsappUrls.length})`;
                    nextBtn.disabled = false;
                } else {
                    nextBtn.textContent = '✅ All Done!';
                    nextBtn.disabled = true;
                }
            } else {
                showStatus('❌ Popup blocked! Please allow popups and try again.', 'error');
            }
        }
        
        function copyAllMessages(whatsappUrls) {
            let allMessages = '';
            whatsappUrls.forEach((item, index) => {
                allMessages += `=== Message ${index + 1} - ${item.phone} ===\n`;
                allMessages += item.message;
                allMessages += '\n\n';
            });
            
            navigator.clipboard.writeText(allMessages).then(() => {
                showStatus('All messages copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = allMessages;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showStatus('All messages copied to clipboard!', 'success');
            });
        }
        
        function downloadMessages(whatsappUrls) {
            let csvContent = 'Phone Number,Message,WhatsApp URL\n';
            whatsappUrls.forEach(item => {
                const escapedMessage = item.message.replace(/"/g, '""');
                const escapedUrl = item.url.replace(/"/g, '""');
                csvContent += `"${item.phone}","${escapedMessage}","${escapedUrl}"\n`;
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'whatsapp_messages.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatus('Messages downloaded as CSV file!', 'success');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
    </script>
</body>
</html>
